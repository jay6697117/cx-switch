name: One-time Actions artifact cleanup

on:
  push:
    paths:
      - .github/workflows/cleanup-actions-storage.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete repository Actions artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete all Actions artifacts in this repository
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const totalBytes = artifacts.reduce(
              (sum, artifact) => sum + (artifact.size_in_bytes || 0),
              0
            );
            core.info(`Found ${artifacts.length} artifact(s), ${totalBytes} byte(s) total.`);

            let deleted = 0;
            let freedBytes = 0;
            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
              deleted += 1;
              freedBytes += artifact.size_in_bytes || 0;
              core.info(`Deleted: ${artifact.name} (#${artifact.id}, ${artifact.size_in_bytes || 0} bytes)`);
            }

            core.notice(`Deleted ${deleted}/${artifacts.length} artifact(s); requested removal of ${freedBytes} byte(s).`);
